
name: Auth CI

on:
  push:
    branches:
      - develop

jobs:
  build:
    name: Build and Generate Artifact
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.13.1'
          cache: npm

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4. Validar estructura del proyecto
      - name: Validate project structure
        run: |
          test -f package.json
          test -f package-lock.json
          test -f nest-cli.json
          test -f tsconfig.build.json
          echo "Project structure validated"

      # 5. Compilar proyecto NestJS
      - name: Build NestJS application
        run: npm run build

      # 6. Preparar archivos del artefacto
      - name: Prepare artifact
        run: |
          mkdir -p artifact

          cp -r dist artifact/
          cp package.json artifact/
          cp package-lock.json artifact/

      # 7. Publicar artefacto
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-build
          path: artifact/
          if-no-files-found: error
          retention-days: 7
